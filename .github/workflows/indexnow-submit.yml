name: IndexNow submit (Bing/Yandex) — CamCompare

# Daily: submit every URL in CamCompare's live sitemap to IndexNow so Bing,
# Yandex, Seznam and Naver recrawl now (Bing also feeds DuckDuckGo, Yahoo and
# Ecosia). Google does not take IndexNow; it reads the sitemap through Search
# Console. Safe to run by hand at any time.
#
# scripts/indexnow-submit.ts reads the key the live /indexnow.txt serves (no
# secret needed), names the host of the sitemap's own URLs and FAILS the run,
# with IndexNow's answer in the log, when anything is refused. It runs with no
# npm install: the script uses only Node built-ins and src/lib/indexnow.ts.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

concurrency:
  group: camcompare-indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://www.camcompare.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes tsx scripts/indexnow-submit.ts
