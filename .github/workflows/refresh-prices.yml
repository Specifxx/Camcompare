# Every three hours: import prices for every market and commit data/offers,
# data/price-history, data/deal-log, data/accessories, data/accessory-history,
# data/store-photos.json, data/releases.json and data/amazon-asins.json to main.
# Each commit is a production build (Vercel builds main).
#
# The markets import as parallel jobs (one runner each, its own time limit):
# one sequential import of all five passed the 120-minute job limit once the
# slow structured-data stores (Ted's, Camera House, JB Hi-Fi) were added, and
# a cancelled job commits nothing. The commit job then gathers whichever
# markets finished, so one slow or failing market never holds up the rest.
# Fails — and GitHub emails the owner — when a configured source breaks.
name: refresh-prices
on:
  schedule:
    - cron: "17 */3 * * *" # every three hours at :17 UTC
  workflow_dispatch:
    inputs:
      markets:
        description: "Comma-separated markets (us,uk,eu,au,sg); empty = all"
        required: false
concurrency: refresh-prices
permissions:
  contents: write
jobs:
  import:
    strategy:
      fail-fast: false
      matrix:
        market: [us, uk, eu, au, sg]
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        if: inputs.markets == '' || inputs.markets == null || contains(inputs.markets, matrix.market)
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: inputs.markets == '' || inputs.markets == null || contains(inputs.markets, matrix.market)
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: inputs.markets == '' || inputs.markets == null || contains(inputs.markets, matrix.market)
      - name: Import prices
        if: inputs.markets == '' || inputs.markets == null || contains(inputs.markets, matrix.market)
        env:
          IMPORT_MARKETS: ${{ matrix.market }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_DAILY_CAP: ${{ vars.EBAY_DAILY_CAP }}
          AMAZON_CREATORS_NA_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_NA_CLIENT_ID }}
          AMAZON_CREATORS_NA_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_NA_CLIENT_SECRET }}
          AMAZON_CREATORS_EU_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_EU_CLIENT_ID }}
          AMAZON_CREATORS_EU_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_EU_CLIENT_SECRET }}
          AMAZON_CREATORS_FE_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_FE_CLIENT_ID }}
          AMAZON_CREATORS_FE_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_FE_CLIENT_SECRET }}
          AMAZON_TAG_US: ${{ secrets.AMAZON_TAG_US }}
          AMAZON_TAG_UK: ${{ secrets.AMAZON_TAG_UK }}
          AMAZON_TAG_DE: ${{ secrets.AMAZON_TAG_DE }}
          AMAZON_TAG_AU: ${{ secrets.AMAZON_TAG_AU }}
          AMAZON_TAG_SG: ${{ secrets.AMAZON_TAG_SG }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          # Feed URLs: one secret per feed retailer, FEED_URL_<KEY> (docs/retailers.md).
          # tests/workflows.test.ts fails if a feed retailer is missing here.
          # FEEDS-START
          FEED_URL_BH: ${{ secrets.FEED_URL_BH }}
          FEED_URL_ADORAMA: ${{ secrets.FEED_URL_ADORAMA }}
          FEED_URL_WALMART: ${{ secrets.FEED_URL_WALMART }}
          FEED_URL_ABT: ${{ secrets.FEED_URL_ABT }}
          FEED_URL_MPB: ${{ secrets.FEED_URL_MPB }}
          FEED_URL_KEH: ${{ secrets.FEED_URL_KEH }}
          FEED_URL_WEX: ${{ secrets.FEED_URL_WEX }}
          FEED_URL_PARK_CAMERAS: ${{ secrets.FEED_URL_PARK_CAMERAS }}
          FEED_URL_JESSOPS: ${{ secrets.FEED_URL_JESSOPS }}
          FEED_URL_CLIFTON_CAMERAS: ${{ secrets.FEED_URL_CLIFTON_CAMERAS }}
          FEED_URL_CAMERAWORLD: ${{ secrets.FEED_URL_CAMERAWORLD }}
          FEED_URL_LCE: ${{ secrets.FEED_URL_LCE }}
          FEED_URL_CURRYS: ${{ secrets.FEED_URL_CURRYS }}
          FEED_URL_MPB_UK: ${{ secrets.FEED_URL_MPB_UK }}
          FEED_URL_CALUMET_DE: ${{ secrets.FEED_URL_CALUMET_DE }}
          FEED_URL_FOTO_ERHARDT: ${{ secrets.FEED_URL_FOTO_ERHARDT }}
          FEED_URL_CYBERPORT: ${{ secrets.FEED_URL_CYBERPORT }}
          FEED_URL_MEDIAMARKT_DE: ${{ secrets.FEED_URL_MEDIAMARKT_DE }}
          FEED_URL_COOLBLUE: ${{ secrets.FEED_URL_COOLBLUE }}
          FEED_URL_MPB_EU: ${{ secrets.FEED_URL_MPB_EU }}
          FEED_URL_CAMERA_HOUSE: ${{ secrets.FEED_URL_CAMERA_HOUSE }}
          FEED_URL_CAMERAPRO: ${{ secrets.FEED_URL_CAMERAPRO }}
          FEED_URL_JBHIFI: ${{ secrets.FEED_URL_JBHIFI }}
          FEED_URL_THE_GOOD_GUYS: ${{ secrets.FEED_URL_THE_GOOD_GUYS }}
          FEED_URL_HARVEY_NORMAN: ${{ secrets.FEED_URL_HARVEY_NORMAN }}
          FEED_URL_BIGW: ${{ secrets.FEED_URL_BIGW }}
          FEED_URL_BUNNINGS: ${{ secrets.FEED_URL_BUNNINGS }}
          # FEEDS-END
        run: npm run import:prices
      - name: Deal log
        # The home page's deal feed memory (src/lib/deal-log.ts): new deals,
        # price drops, and deals that sold or expired since the last import.
        if: inputs.markets == '' || inputs.markets == null || contains(inputs.markets, matrix.market)
        run: npx tsx scripts/update-deal-log.ts ${{ matrix.market }}
      - uses: actions/upload-artifact@v4
        if: inputs.markets == '' || inputs.markets == null || contains(inputs.markets, matrix.market)
        with:
          name: market-${{ matrix.market }}
          retention-days: 2
          if-no-files-found: ignore
          path: |
            data/offers/${{ matrix.market }}.json
            data/price-history/${{ matrix.market }}/
            data/deal-log/${{ matrix.market }}.json
            data/accessories/${{ matrix.market }}.json
            data/accessory-history/${{ matrix.market }}/
            data/amazon-asins.json
  commit:
    needs: import
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: market-*
          path: incoming
      - name: Gather markets
        run: npx tsx scripts/merge-market-artifacts.ts incoming && rm -rf incoming
      - name: Store photos
        # Products without a licensed thumbnail get a store's photo
        # (src/lib/store-photos.ts), from every market's offers.
        run: npx tsx scripts/write-store-photos.ts
      - name: Exchange rates
        # For the "Price around the world" panel and /world only. Never fails
        # the job: on any error the script keeps the last data/fx.json.
        continue-on-error: true
        run: npx tsx scripts/fetch-fx.ts
      - name: Just announced
        # Makers' launch videos and press releases -> data/releases.json
        # (scripts/fetch-releases.ts). Rides the price commit: no extra build.
        # YouTube videos need YOUTUBE_API_KEY (its robots.txt disallows the feeds).
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RELEASES_YOUTUBE_RSS: ${{ vars.RELEASES_YOUTUBE_RSS }}
        run: npx tsx scripts/fetch-releases.ts
      - name: Family feed
        # The Compare Empire network (scripts/family-sync.ts): our best deals and camera pages for Compare
        # Empire, and its feed for our deals pages and hand-offs. Never fails the job.
        continue-on-error: true
        run: npx tsx scripts/family-sync.ts
      - name: Commit data
        run: |
          git config user.name "camcompare-bot"
          git config user.email "camcompare-bot@users.noreply.github.com"
          for f in data/family data/offers data/price-history data/deal-log data/accessories data/accessory-history data/store-photos.json data/releases.json data/amazon-asins.json data/fx.json; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "no price changes"; else git commit -m "data: prices $(date -u +%FT%H:%MZ)" && git pull --rebase origin main && git push; fi
      - name: Price alerts
        # Emails confirmed price alerts (scripts/check-alerts.ts). Skips cleanly
        # until DATABASE_URL and RESEND_API_KEY are GitHub secrets. Never fails
        # the price job: a broken email send is logged here, not a lost import.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM_EMAIL: ${{ secrets.ALERTS_FROM_EMAIL }}
        run: npx tsx scripts/check-alerts.ts
      - name: Check sources
        run: npx tsx scripts/check-sources.ts
